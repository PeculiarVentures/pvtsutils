name: Publish

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The GitHub Release is the last publish step, so its absence means the version is not fully released.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")

          case "$STATUS" in
            200) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP $STATUS while checking release v$VERSION"; exit 1 ;;
          esac

  publish:
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.release == 'true'
    environment: npm

    permissions:
      contents: write
      id-token: write
      pull-requests: read

    env:
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags and history for the fallback release notes below.
          fetch-depth: 0

      - name: Verify
        uses: ./.github/actions/verify
        with:
          registry-url: https://registry.npmjs.org

      - name: Get release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"

          # Take the notes reviewed in the merged release PR (written by Version Bump between the markers).
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].body // ""' \
            | tr -d '\r' \
            | awk '/<!-- release-notes:end -->/ { found = 0 } found { print } /<!-- release-notes:start -->/ { found = 1 }' \
            > "$NOTES"

          # No release PR (e.g. package.json bumped directly): generate the notes from the commits.
          # --from pins the range, so a re-run after the release tag was pushed still finds the commits.
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::warning::No release notes found in a merged release PR; generating them from commits"
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude "v$VERSION" HEAD 2> /dev/null || true)
            npx conventional-changelog -p angular --stdout ${PREV:+--from "$PREV"} | awk '!/^##? \[?[0-9]+\.[0-9]+\.[0-9]+/' > "$NOTES"
          fi

          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "Maintenance release; no user-facing changes." > "$NOTES"
          fi

      - name: Publish to npm via Trusted Publisher
        run: |
          NAME=$(node -p "require('./package.json').name")

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
          else
            # Skip prepack: publish the build verified above instead of rebuilding.
            npm publish --ignore-scripts
          fi

      - name: Push tags
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null
          STATUS=$?
          set -e

          case "$STATUS" in
            0)
              echo "Tag v$VERSION already exists"
              git fetch --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
              ;;
            2)
              git tag "v$VERSION"
              git push origin "v$VERSION"
              ;;
            *)
              echo "::error::git ls-remote failed with exit code $STATUS"
              exit 1
              ;;
          esac

          git tag -f "v${VERSION%%.*}" "v$VERSION^{commit}"
          git push -f origin "v${VERSION%%.*}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
