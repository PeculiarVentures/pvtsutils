name: Publish

on:
  push:
    branches:
      - master
  # Re-runs publishing for the current version, e.g. after a failed npm publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      # Opens or updates the release PR from Conventional Commits; once that PR is merged,
      # creates the v<version> tag and the GitHub Release with the notes from the PR.
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PRs opened with GITHUB_TOKEN do not trigger other workflows; set RELEASE_TOKEN so Test runs on the release PR.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

  publish:
    runs-on: ubuntu-24.04
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    environment: npm

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build exactly the released commit, even when a manual run starts after newer commits landed.
      - name: Check out the release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if ! git fetch --no-tags --depth 1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION does not exist; merge the release PR first"
            exit 1
          fi

          git checkout -q "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check generated package exports are committed
        run: git diff --exit-code package.json

      - name: Publish to npm via Trusted Publisher
        run: |
          NAME=$(node -p "require('./package.json').name")

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
          else
            npm publish
          fi

      - name: Move major tag
        run: |
          git tag -f "v${VERSION%%.*}" "v$VERSION^{commit}"
          git push -f origin "v${VERSION%%.*}"
