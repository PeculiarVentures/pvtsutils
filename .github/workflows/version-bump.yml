name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Notes for the commits since the last release tag; --stdout prints only the new
          # section (there is no CHANGELOG.md), and awk drops its "# [x.y.z](...)" heading.
          npx conventional-changelog -p angular --stdout | awk '!/^##? \[?[0-9]+\.[0-9]+\.[0-9]+/' > "$RUNNER_TEMP/notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "Maintenance release; no user-facing changes." > "$RUNNER_TEMP/notes.md"
          fi

          # Publish copies the text between the markers into the GitHub Release.
          {
            echo "Version bump: \`$BUMP\` → \`v$VERSION\`"
            echo
            echo "Review the version and the release notes below before merging. Edits between the markers become the GitHub Release notes. After merge the **Publish** workflow runs checks, publishes to npm, pushes the \`v$VERSION\` tag, moves the major tag, and creates the GitHub Release."
            echo
            echo "<!-- release-notes:start -->"
            cat "$RUNNER_TEMP/notes.md"
            echo "<!-- release-notes:end -->"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with GITHUB_TOKEN do not trigger other workflows; set RELEASE_TOKEN so Test runs on the release PR.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          branch: release/version-bump
          commit-message: "chore(release): v${{ steps.version.outputs.version }}"
          title: "chore(release): v${{ steps.version.outputs.version }}"
          body-path: ${{ runner.temp }}/pr-body.md
